name: Release

# On a version tag: Linux packages go to a GitHub Release, the server image to GHCR.
# There is no auto-update: electron-builder publishes no update metadata (see `publish: null`).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Version from the tag
        run: pnpm --filter @co-write/desktop exec npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: pnpm package
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bae-alves/co-write-server
          # v1.2.3 → :v1.2.3 and :latest
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: apps/server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
