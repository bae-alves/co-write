# Desktop packages (Phase 5). co-write ships for Linux only; anyone wanting another platform can
# build it themselves. `pnpm package` builds the AppImage and the .deb into apps/desktop/dist.
appId: dev.cowrite.desktop
productName: co-write
executableName: co-write
# Not the npm name: `@co-write/desktop` would put a slash in the file name.
artifactName: co-write-${version}-${arch}.${ext}
copyright: Copyright © co-write contributors. AGPL-3.0-only.
directories:
  output: dist
  buildResources: build
# main and preload are bundled by electron-vite (only `electron` stays external) and the renderer
# is a static bundle, so no node_modules ship with the app.
files:
  - out/**/*
  - package.json
  - '!**/node_modules/**'
asar: true
linux:
  target:
    - AppImage
    - deb
  category: Office
  # The window's WM_CLASS matches the .desktop entry, so launchers group it with the app.
  syncDesktopName: true
  maintainer: co-write contributors
