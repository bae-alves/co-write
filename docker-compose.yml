# Local development dependencies. The Ktor server and Electron app run on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cowrite
      POSTGRES_USER: cowrite
      POSTGRES_PASSWORD: cowrite
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cowrite -d cowrite']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
